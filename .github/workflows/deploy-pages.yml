name: Déploiement GitHub Pages (ConstructPro)

# Publie l'application ConstructPro sur GitHub Pages.
# Le dépôt contient plusieurs projets mais GitHub Pages n'offre qu'un seul
# site par dépôt : l'application est donc servie dans un sous-dossier au nom
# de la branche (même convention que .github/workflows/pages.yml), et la
# racine du site redirige vers ce sous-dossier.
#   https://<utilisateur>.github.io/Claude/claude/construction-sme-app-rc82di/
on:
  push:
    branches:
      - claude/construction-sme-app-rc82di
    paths:
      - 'construction-sme-app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job sans « environment » : les règles de protection de l'environnement
  # github-pages bloquent un job AVANT sa première étape, donc l'activation de
  # Pages doit se faire ici pour pouvoir réellement s'exécuter.
  construction:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Note : la source du site Pages (« Deploy from a branch » ou « GitHub
      # Actions ») ne peut pas être changée depuis un workflow — le GITHUB_TOKEN
      # reçoit « 403 Resource not accessible by integration » sur
      # PUT /repos/{repo}/pages, même avec la permission pages: write. Ce
      # réglage doit être fait dans Settings → Pages → Build and deployment.
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: construction-sme-app/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: construction-sme-app

      # Adresse et clé publique de la base de données, injectées au moment de
      # la construction. Tant que ces secrets ne sont pas définis dans le
      # dépôt, l'application fonctionne sur le stockage du navigateur.
      # La clé « anon » est faite pour être publique : la protection des
      # données vient des règles d'accès (voir construction-sme-app/supabase).
      # Un secret mal orthographié est autrement invisible : la construction
      # réussit et l'application repart silencieusement sur le stockage du
      # navigateur. Ce contrôle dit seulement si chaque secret est présent et
      # s'il a la forme attendue — jamais sa valeur.
      - name: Vérifier la configuration de la base de données
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          etat() { [ -n "$1" ] && echo "présent (${#1} caractères)" || echo "ABSENT"; }
          echo "VITE_SUPABASE_URL      : $(etat "$VITE_SUPABASE_URL")"
          echo "VITE_SUPABASE_ANON_KEY : $(etat "$VITE_SUPABASE_ANON_KEY")"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "→ Base de données non configurée : l'application utilisera le stockage du navigateur."
            echo "  Vérifiez le nom des secrets dans Settings → Secrets and variables → Actions."
            exit 0
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) echo "→ Adresse du projet : forme attendue." ;;
            *) echo "::warning::VITE_SUPABASE_URL ne ressemble pas à https://xxxx.supabase.co" ;;
          esac
          # Une clé service_role a exactement la même forme qu'une clé anon :
          # seul le rôle inscrit dans le jeton les distingue. On le lit, car
          # publier une clé service_role sur un site public donnerait à
          # n'importe quel visiteur un accès total à la base.
          role_de_jwt() {
            corps=$(printf '%s' "$1" | cut -d. -f2 | tr '_-' '/+')
            case $(( ${#corps} % 4 )) in 2) corps="$corps==" ;; 3) corps="$corps=" ;; esac
            printf '%s' "$corps" | base64 -d 2>/dev/null \
              | sed -n 's/.*"role"[[:space:]]*:[[:space:]]*"\([a-z_]*\)".*/\1/p'
          }
          case "$VITE_SUPABASE_ANON_KEY" in
            eyJ*)
              role=$(role_de_jwt "$VITE_SUPABASE_ANON_KEY")
              case "$role" in
                anon) echo "→ Clé publique : rôle « anon », correct." ;;
                service_role)
                  echo "::error::La clé enregistrée est la clé service_role, pas la clé anon."
                  echo "Elle contourne toutes les règles d'accès et serait visible par tous les visiteurs du site."
                  echo "Déploiement interrompu. Remplacez le secret par la clé « anon public », puis révoquez la clé service_role dans Supabase."
                  exit 1 ;;
                "") echo "::warning::Impossible de lire le rôle de la clé — vérifiez qu'il s'agit bien de la clé « anon public »." ;;
                *)  echo "::warning::Rôle inattendu dans la clé : « $role ». Attendu : anon." ;;
              esac ;;
            sb_publishable_*) echo "→ Clé publique (nouveau format) : forme attendue." ;;
            *) echo "::warning::VITE_SUPABASE_ANON_KEY ne ressemble pas à une clé publique Supabase. Attention à ne jamais utiliser la clé service_role." ;;
          esac

      - name: Construire l'application
        run: npm run build
        working-directory: construction-sme-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Assembler le site (application dans un sous-dossier au nom de la branche)
        run: |
          chemin="claude/construction-sme-app-rc82di"
          mkdir -p "_site/$chemin"
          cp -r construction-sme-app/dist/. "_site/$chemin/"
          # La racine du dépôt redirige vers l'application
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=./claude/construction-sme-app-rc82di/">
          <link rel="canonical" href="./claude/construction-sme-app-rc82di/">
          <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
          <title>ConstructPro</title></head>
          <body><p>Redirection vers <a href="./claude/construction-sme-app-rc82di/">ConstructPro</a>…</p></body></html>
          HTML

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Seul ce job porte « environment: github-pages », comme l'exige
  # actions/deploy-pages. Si les règles de protection de l'environnement
  # refusent la branche, l'échec est isolé ici et le site a déjà été construit.
  deploiement:
    needs: construction
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
