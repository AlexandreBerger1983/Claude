# Configuration du Robot Tondeuse / Poubelles
# Copier ce fichier en robot.yaml et adapter au câblage réel

robot:
  name: "Johnny-Mow"

# --- Moteurs de déplacement ---
motors:
  left:
    in1: 17   # GPIO BCM
    in2: 27
    pwm: 18
  right:
    in1: 22
    in2: 23
    pwm: 24
  max_speed: 80        # % PWM max en mode manuel (0-100)
  ramp_time: 0.1       # secondes pour atteindre la vitesse cible

# --- Lame de tonte ---
blade:
  pin: 25              # GPIO signal ESC
  min_pulse: 1000      # µs (arrêt)
  max_pulse: 2000      # µs (pleine puissance)
  startup_speed: 60    # % au démarrage
  full_speed: 85       # % en tonte

# --- Bras robotiques (servos via PCA9685 sur I2C) ---
arms:
  i2c_address: 0x40
  pwm_frequency: 50    # Hz

  left:
    shoulder: 0        # canal PCA9685
    elbow: 1
    wrist: 2
    gripper: 3
    # Angles en degrés
    home:    [90, 45, 90, 0]
    reach:   [45, 90, 90, 0]
    grasp:   [45, 90, 90, 60]
    lift:    [90, 45, 90, 60]

  right:
    shoulder: 4
    elbow: 5
    wrist: 6
    gripper: 7
    home:    [90, 45, 90, 0]
    reach:   [135, 90, 90, 0]
    grasp:   [135, 90, 90, 60]
    lift:    [90, 45, 90, 60]

  servo_min: 150       # pulse min PCA9685
  servo_max: 600       # pulse max PCA9685

  # --- Tête mobile (nuque pan/tilt) - style Johnny 5 ---
  head:
    pan: 8             # canal PCA9685 (rotation gauche/droite)
    tilt: 9            # canal PCA9685 (haut/bas)
    home: [90, 90]     # position repos [pan, tilt] en degrés
    pan_range:  [40, 140]   # butées mécaniques rotation
    tilt_range: [65, 115]   # butées mécaniques inclinaison

# --- Téléopération (imitation par webcam) ---
teleop:
  smoothing: 0.4       # lissage 0=figé .. 1=aucun filtre (réactif mais saccadé)
  max_step_deg: 20     # déplacement max des servos par mise à jour (protection)
  send_fps: 20         # fréquence d'envoi des poses depuis le navigateur
  gripper_open: 0      # angle servo pince quand la main est ouverte
  gripper_closed: 70   # angle servo pince quand la main est fermée (poing)

# --- Capteurs ultrasons HC-SR04 ---
sensors:
  ultrasonic:
    front:
      trigger: 5
      echo: 6
    rear:
      trigger: 13
      echo: 19
    left:
      trigger: 26
      echo: 20
    right:
      trigger: 21
      echo: 16
  obstacle_distance: 40  # cm - distance d'arrêt
  blade_stop_distance: 30  # cm - arrêt lame

  emergency_button: 4    # GPIO bouton d'arrêt d'urgence

# --- Caméra ---
camera:
  enabled: true
  resolution: [640, 480]
  framerate: 15
  stream_quality: 75   # qualité JPEG 0-100

# --- GPS RTK (u-blox ZED-F9P) ---
gps:
  enabled: true
  port: "/dev/ttyUSB0"      # ou /dev/ttyACM0 selon le câble USB
  baud: 115200

  # Corrections NTRIP via internet (gratuit au Canada - NRCAN)
  ntrip:
    enabled: true
    host: "rtk2go.com"       # serveur NTRIP public
    port: 2101
    # Trouver le mountpoint le plus proche sur : http://rtk2go.com:2101/SNIP::STATUS
    # Au Québec, essayer : MANA, JOIE, LAVI, MTL1...
    mountpoint: "MTL1"
    user: "votre@email.com"  # s'enregistrer gratuitement sur rtk2go.com
    password: ""

# --- Serveur web ---
web:
  host: "0.0.0.0"
  port: 5000
  secret_key: "change-me-in-production"
  watchdog_timeout: 3.0  # secondes sans commande avant arrêt auto

# --- Algorithme de tonte ---
mowing:
  strip_width: 30      # cm (largeur de passage)
  turn_speed: 40       # % vitesse en virage
  forward_speed: 60    # % vitesse en ligne droite
  overlap: 5           # cm de chevauchement entre bandes
